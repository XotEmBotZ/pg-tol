# ==============================================================================
# PG-TOL: PostgreSQL 16 Server Configuration
# ==============================================================================

# Network & Connections
listen_addresses = '*'
max_connections = 150
shared_buffers = 256MB
dynamic_shared_memory_type = posix

# ==============================================================================
# Session Auditing Subsystem (pgaudit)
# ==============================================================================
shared_preload_libraries = 'pgaudit'

pgaudit.log = 'read, write, ddl, function, role'
pgaudit.role = 'student_role'          # Only audit queries by student_role users
pgaudit.log_catalog = off             # Suppress \d, \dt catalog inspection queries
pgaudit.log_statement_once = on       # Prevent log bloat on multi-relation joins
pgaudit.log_client = off              # Do not echo audit records to student psql terminal
pgaudit.log_level = 'log'
pgaudit.log_rows = on                 # Record row counts affected
pgaudit.log_parameter = on            # Log bind parameter values

# ==============================================================================
# Native CSV Logging (for file_fdw In-Database Querying)
# ==============================================================================
logging_collector = on
log_destination = 'csvlog'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.csv'
log_rotation_age = 1d
log_rotation_size = 500MB
log_statement = 'all'
log_duration = on
log_line_prefix = '%m [%p] user=%u db=%d app=%a '
log_timezone = 'UTC'

# ==============================================================================
# Crash Prevention Guardrails
# ==============================================================================
statement_timeout = '5000ms'                       # Kills queries running > 5s
idle_in_transaction_session_timeout = '10000ms'    # Kills abandoned open transactions > 10s
lock_timeout = '3000ms'                            # Kills transactions waiting on locks > 3s
work_mem = '16MB'                                  # Caps RAM consumption per query
temp_file_limit = '100MB'                          # Caps temp disk usage

# Date & Locale
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
