services:
  # ============================================================================
  # 1. PostgreSQL 16 Engine with pgaudit & file_fdw
  # ============================================================================
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: pg-tol-postgres
    # restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/pg_data:/var/lib/postgresql/data
      - ./data/pg_logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faculty_admin} -d ${POSTGRES_DB:-lab_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pgtol-network

  # ============================================================================
  # 2. pgAdmin 4 (GUI Database Administration)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pg-tol-pgadmin
    # restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-80}:80"
    environment:
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./data/pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pgtol-network

  # ============================================================================
  # 3. Faculty Dashboard Console (Next.js 15+ Web App - The ONLY Custom UI)
  # ============================================================================
  faculty-dashboard:
    build:
      context: ./apps/faculty-dashboard
      dockerfile: Dockerfile
    container_name: pg-tol-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lab_db}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./data/pg_logs:/var/log/postgresql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pgtol-network
      
networks:
  pgtol-network:
    name: pg-tol-net
    driver: bridge
